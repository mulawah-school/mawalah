<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة مالك المنصة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#eff6ff,#f8fafc);color:#0f172a}
.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 35px rgba(15,23,42,.09);margin-bottom:18px}
h1{margin:0 0 8px;font-size:28px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:12px 17px;font-size:15px;cursor:pointer;background:#0f766e;color:#fff}
button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:#b91c1c}button.warn{background:#b45309}
.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:right}th{background:#f8fafc}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px}.on{background:#dcfce7;color:#166534}.off{background:#fee2e2;color:#991b1b}
.linkbox{display:flex;gap:8px;align-items:center}.linkbox input{direction:ltr;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.notice{padding:12px;border-radius:12px;background:#fefce8;color:#854d0e;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:15px}table{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div><h1>🛠️ لوحة تحكم مالك المنصة</h1><div class="muted">إدارة المدارس والروابط بدون اسم مستخدم أو كلمة مرور للمدارس.</div></div>
      <div id="status" class="muted"></div>
    </div>
  </div>

  <div id="login" class="card">
    <h2>دخول المالك</h2>
    <p class="muted">هذا الرمز خاص بمالك المنصة فقط، وليس رمز دخول للمدارس.</p>
    <input id="ownerPin" type="password" inputmode="numeric" maxlength="20" placeholder="رمز المالك">
    <button style="margin-top:10px" onclick="login()">دخول</button>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>➕ إضافة مدرسة</h2>
      <div class="grid">
        <div><label>اسم المدرسة</label><input id="schoolName" placeholder="مثال: مدرسة معولة بن شمس"></div>
        <div><label>رابط الشعار (اختياري)</label><input id="schoolLogo" placeholder="https://..."></div>
      </div>
      <button style="margin-top:14px" onclick="createSchool()">إنشاء الرابط</button>
      <div id="created" class="notice hidden"></div>
    </div>

    <div class="card">
      <div class="top"><h2>🏫 المدارس</h2><button class="secondary" onclick="loadSchools()">↻ تحديث</button></div>
      <div id="tableWrap">جاري التحميل...</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbwX06YdlSJP6Le-YfovLoZKuBEe8X6t9j6PBsTdda7oWYxbprz0PPtUE-gSnYCaKRGixA/exec';
let pin='';
let schoolsCache=[];

async function apiGet(action, params={}) {
  const q=new URLSearchParams({action,...params,_:Date.now()});
  const r=await fetch(API+'?'+q.toString(),{cache:'no-store'});
  const j=await r.json();
  if(!j.success) throw new Error(j.error||'حدث خطأ');
  return j;
}
async function apiPost(data) {
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),cache:'no-store'});
  const j=await r.json();
  if(!j.success) throw new Error(j.error||'حدث خطأ');
  return j;
}
async function login(){
  pin=document.getElementById('ownerPin').value.trim();
  if(!pin) return alert('أدخل رمز المالك.');
  try{await apiGet('ownerSchools',{pin});document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadSchools();}
  catch(e){alert('❌ '+e.message);document.getElementById('ownerPin').value='';}
}
function makePublicLink(school,key){
  const base=location.href.replace(/owner\.html.*$/,'index.html');
  return base+'?school='+encodeURIComponent(school.schoolId)+'&key='+encodeURIComponent(key);
}
async function createSchool(){
  const name=document.getElementById('schoolName').value.trim();
  const logo=document.getElementById('schoolLogo').value.trim();
  if(!name)return alert('أدخل اسم المدرسة.');
  try{
    const r=await apiPost({action:'ownerCreateSchool',pin,name,logo});
    const link=makePublicLink(r.school,r.key);
    const box=document.getElementById('created');
    box.classList.remove('hidden');
    box.innerHTML='<b>✅ تم إنشاء المدرسة.</b><br><br><div class="linkbox"><input id="newLink" readonly value="'+escapeHtml(link)+'"><button onclick="copyLink(document.getElementById(\'newLink\').value)">نسخ</button></div><div style="margin-top:8px">معرّف المدرسة: <b>'+escapeHtml(r.school.schoolId)+'</b></div><div class="muted" style="margin-top:8px">احتفظ بهذا الرابط؛ امتلاكه هو وسيلة الوصول للمدرسة.</div>';
    document.getElementById('schoolName').value='';document.getElementById('schoolLogo').value='';
    loadSchools();
  }catch(e){alert('❌ '+e.message)}
}
async function loadSchools(){
  try{
    const r=await apiGet('ownerSchools',{pin});
    const rows=r.schools||[];
    schoolsCache=rows;
    if(!rows.length){document.getElementById('tableWrap').innerHTML='<p class="muted">لا توجد مدارس بعد.</p>';return}
    document.getElementById('tableWrap').innerHTML='<table><thead><tr><th>المدرسة</th><th>المعرف</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>'+
      rows.map(s=>'<tr><td>'+escapeHtml(s.name)+'</td><td>'+escapeHtml(s.schoolId)+'</td><td><span class="badge '+(s.active?'on':'off')+'">'+(s.active?'مفعّل':'معطّل')+'</span></td><td><div class="actions"><button onclick="showLink(\''+escapeJs(s.schoolId)+'\')">عرض الرابط</button><button class="'+(s.active?'danger':'secondary')+'" onclick="toggleSchool(\''+escapeJs(s.schoolId)+'\','+(!s.active)+')">'+(s.active?'تعطيل':'تفعيل')+'</button></div></td></tr>').join('')+
      '</tbody></table><div id="linkArea" class="notice hidden"></div>';
  }catch(e){document.getElementById('tableWrap').innerHTML='<div style="color:#b91c1c">❌ '+escapeHtml(e.message)+'</div>'}
}
async function toggleSchool(id,active){
  if(!confirm(active?'هل تريد تفعيل رابط المدرسة؟':'هل تريد تعطيل رابط المدرسة؟'))return;
  try{await apiPost({action:'ownerToggleSchool',pin,schoolId:id,active});loadSchools()}catch(e){alert('❌ '+e.message)}
}
async function showLink(id){
  const s=schoolsCache.find(x=>String(x.schoolId)===String(id));
  const area=document.getElementById('linkArea');area.classList.remove('hidden');
  if(!s || !s.key){area.innerHTML='<b>تعذر استرجاع الرابط.</b>';return;}
  const link=makePublicLink(s,s.key);
  area.innerHTML='<b>🔗 رابط المدرسة:</b><div class="linkbox" style="margin-top:8px"><input id="existingLink" readonly value="'+escapeHtml(link)+'"><button onclick="copyLink(document.getElementById(\'existingLink\').value)">نسخ</button></div><div id="qr" style="margin-top:15px"></div>';
  if(window.QRCode){new QRCode(document.getElementById('qr'),{text:link,width:180,height:180});}
}
async function copyLink(v){try{await navigator.clipboard.writeText(v);alert('✅ تم نسخ الرابط.')}catch(e){prompt('انسخ الرابط:',v)}}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeJs(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
</script>
</body>
</html>
